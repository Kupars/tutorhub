<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能测速与最快节点切换</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="container" style="max-width:680px;padding-top:40px;">
    <div class="panel">
      <h2>⚡ 自动选择最快访问节点</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">
        系统会并发测试你在 <code>js/app-env.js</code> 中配置的多平台镜像节点延迟，自动为你挑选当前网络最快的入口。
      </p>
      <div id="nodeList" style="display:flex;flex-direction:column;gap:10px;"></div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="btnRetest">🔄 重新测速并跳转最快节点</button>
        <a href="./index.html" class="btn" style="text-decoration:none;">返回当前站点</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { APP_CONFIG } from "./js/app-env.js";

    const listEl = document.getElementById("nodeList");
    const defaultNodes = APP_CONFIG.nodes.length
      ? APP_CONFIG.nodes
      : [{ name: "当前访问节点", url: window.location.origin }];

    async function probe(node) {
      const start = performance.now();
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3500);
        await fetch(node.url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
        clearTimeout(timer);
        return { ...node, ok: true, ms: Math.round(performance.now() - start) };
      } catch {
        return { ...node, ok: false, ms: 9999 };
      }
    }

    async function runRace(autoJump = false) {
      listEl.innerHTML = `<p style="font-size:13px;color:var(--muted);">正在并发测速，请稍候...</p>`;
      const results = await Promise.all(defaultNodes.map(probe));
      results.sort((a, b) => a.ms - b.ms);

      listEl.innerHTML = results.map((r, i) => `
        <div style="border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div>
            <strong>${i === 0 && r.ok ? "🏆 " : ""}${r.name}</strong>
            <div style="font-size:12px;color:var(--muted);">${r.url}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="chip ${r.ok ? "status-open" : "urgent"}">${r.ok ? `${r.ms} ms` : "超时/不可达"}</span>
            <a class="btn btn-sm" href="${r.url}" style="text-decoration:none;">前往</a>
          </div>
        </div>
      `).join("");

      if (autoJump && results[0]?.ok && results[0].url !== window.location.origin) {
        window.location.href = results[0].url;
      }
    }

    document.getElementById("btnRetest").onclick = () => runRace(true);
    runRace(false);
  </script>
</body>
</html>
